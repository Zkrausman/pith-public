name: Bug report
description: Report a reproducible problem with Pith
title: "bug: "
labels: [bug]
body:
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction
      description: Include commands, expected behavior, and actual behavior. Remove secrets and private output.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Pith version and platform
    validations:
      required: true
